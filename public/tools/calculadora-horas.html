<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Horas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    /* Estilização para desabilitar seleção de texto nos botões */
    .no-select {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4"><nav id="dp-panel-nav" style="position:fixed;top:0;left:0;right:0;z-index:99999;height:44px;background:#1f2937;display:flex;align-items:center;padding:0 20px;box-shadow:0 1px 4px rgba(0,0,0,.2);font-family:'Poppins',-apple-system,sans-serif;"><a href="/" style="color:#fff;text-decoration:none;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Painel DP</a><span style="margin-left:auto;color:rgba(255,255,255,.45);font-size:11px;font-weight:500;letter-spacing:.04em;">AUTOMAÇÕES DP</span></nav><div style="height:44px;"></div>

  <!-- Container da Calculadora -->
  <div class="w-full h-[520px] sm:w-[320px] bg-[#f3f3f3] sm:rounded-xl shadow-2xl flex flex-col border border-gray-300 overflow-hidden text-gray-900 no-select">
    
    <!-- Window Title Bar (Estilo Windows) -->
    <div class="h-8 flex shrink-0 justify-between items-center pl-3 hover:bg-gray-100 transition-colors cursor-default">
      <div class="flex items-center gap-2">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 3C2 2.44772 2.44772 2 3 2H13C13.5523 2 14 2.44772 14 3V13C14 13.5523 13.5523 14 13 14H3C2.44772 14 2 13.5523 2 13V3Z" stroke="#0067c0" stroke-width="1.5"/>
          <path d="M5 5H5.01M8 5H8.01M11 5H11.01M5 8H5.01M8 8H8.01M11 8H11.01M5 11H5.01M8 11H8.01M11 11H11.01" stroke="#0067c0" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="text-[11px] font-medium text-gray-700 font-sans tracking-wide">Calculadora</span>
      </div>
      <div class="flex h-full">
        <button class="w-11 h-full flex items-center justify-center hover:bg-gray-200 text-gray-600 transition-colors">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0,4.5 L10,4.5" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="w-11 h-full flex items-center justify-center hover:bg-gray-200 text-gray-600 transition-colors">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="w-11 h-full flex items-center justify-center hover:bg-red-500 hover:text-white text-gray-600 transition-colors">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0.5,0.5 L9.5,9.5 M0.5,9.5 L9.5,0.5" stroke="currentColor" stroke-width="1"/></svg>
        </button>
      </div>
    </div>

    <!-- Menu Bar (Header interno) -->
    <div class="h-10 flex shrink-0 justify-start items-center px-3 pt-1">
      <div class="flex items-center gap-1">
        <div class="w-9 h-9 rounded-md flex items-center justify-center text-gray-800">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3.5h14v1H1v-1zm0 4h14v1H1v-1zm0 4h14v1H1v-1z"/></svg>
        </div>
        <span class="text-[18px] font-semibold tracking-wide ml-1 text-gray-900">
          Horas
        </span>
      </div>
    </div>

    <!-- Área do Visor -->
    <div class="h-24 flex shrink-0 flex-col justify-end items-end px-4 pb-2">
      <div id="expressionDisplay" class="text-gray-500 text-[13px] h-5 mb-1 tracking-wider">
        <!-- Expressão aparece aqui -->
      </div>
      <div id="mainDisplay" class="text-5xl font-semibold tracking-tight overflow-hidden flex items-end">
        00:00:00
      </div>
    </div>

    <!-- Barra de Memória -->
    <div class="flex px-1 pb-1 gap-[2px] shrink-0">
      <button id="btn-mc" onclick="handleMemory('MC')" class="flex-1 h-8 rounded-md text-xs font-semibold flex items-center justify-center transition-colors hover:bg-gray-200 active:bg-gray-300 text-gray-400 cursor-not-allowed">MC</button>
      <button id="btn-mr" onclick="handleMemory('MR')" class="flex-1 h-8 rounded-md text-xs font-semibold flex items-center justify-center transition-colors hover:bg-gray-200 active:bg-gray-300 text-gray-400 cursor-not-allowed">MR</button>
      <button onclick="handleMemory('M+')" class="flex-1 h-8 rounded-md text-xs font-semibold flex items-center justify-center transition-colors hover:bg-gray-200 active:bg-gray-300 text-gray-900">M+</button>
      <button onclick="handleMemory('M-')" class="flex-1 h-8 rounded-md text-xs font-semibold flex items-center justify-center transition-colors hover:bg-gray-200 active:bg-gray-300 text-gray-900">M-</button>
      <button onclick="handleMemory('MS')" class="flex-1 h-8 rounded-md text-xs font-semibold flex items-center justify-center transition-colors hover:bg-gray-200 active:bg-gray-300 text-gray-900">MS</button>
      <button id="btn-mdown" class="flex-1 h-8 rounded-md text-xs font-semibold flex items-center justify-center transition-colors hover:bg-gray-200 text-gray-400 cursor-not-allowed">M▾</button>
    </div>

    <!-- Teclado (Grid 4x6) -->
    <div class="flex-1 grid grid-cols-4 grid-rows-6 gap-[3px] p-1 bg-[#f3f3f3]">
      <!-- Row 1 -->
      <button onclick="handleOperator('%')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] bg-[#f9f9f9] hover:bg-[#eaeaea] active:bg-[#dbdbdb] text-gray-900">%</button>
      <button onclick="handleClearEntry()" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] bg-[#f9f9f9] hover:bg-[#eaeaea] active:bg-[#dbdbdb] text-gray-900">CE</button>
      <button onclick="handleClearAll()" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] bg-[#f9f9f9] hover:bg-[#eaeaea] active:bg-[#dbdbdb] text-gray-900">C</button>
      <button onclick="handleBackspace()" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] bg-[#f9f9f9] hover:bg-[#eaeaea] active:bg-[#dbdbdb] text-gray-900">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
      </button>

      <!-- Row 2 -->
      <button disabled class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] bg-[#f9f9f9] opacity-50 cursor-not-allowed text-gray-400 italic">1/x</button>
      <button disabled class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] bg-[#f9f9f9] opacity-50 cursor-not-allowed text-gray-400 italic">x²</button>
      <button disabled class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] bg-[#f9f9f9] opacity-50 cursor-not-allowed text-gray-400 italic">√x</button>
      <button onclick="handleOperator('÷')" class="flex items-center justify-center rounded-[6px] transition-colors text-xl bg-[#f9f9f9] hover:bg-[#eaeaea] active:bg-[#dbdbdb] text-gray-900">÷</button>

      <!-- Row 3 -->
      <button onclick="handleDigit('7')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">7</button>
      <button onclick="handleDigit('8')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">8</button>
      <button onclick="handleDigit('9')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">9</button>
      <button onclick="handleOperator('x')" class="flex items-center justify-center rounded-[6px] transition-colors text-xl bg-[#f9f9f9] hover:bg-[#eaeaea] active:bg-[#dbdbdb] text-gray-900">×</button>

      <!-- Row 4 -->
      <button onclick="handleDigit('4')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">4</button>
      <button onclick="handleDigit('5')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">5</button>
      <button onclick="handleDigit('6')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">6</button>
      <button onclick="handleOperator('-')" class="flex items-center justify-center rounded-[6px] transition-colors text-2xl bg-[#f9f9f9] hover:bg-[#eaeaea] active:bg-[#dbdbdb] text-gray-900">-</button>

      <!-- Row 5 -->
      <button onclick="handleDigit('1')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">1</button>
      <button onclick="handleDigit('2')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">2</button>
      <button onclick="handleDigit('3')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">3</button>
      <button onclick="handleOperator('+')" class="flex items-center justify-center rounded-[6px] transition-colors text-xl bg-[#f9f9f9] hover:bg-[#eaeaea] active:bg-[#dbdbdb] text-gray-900">+</button>

      <!-- Row 6 -->
      <button onclick="handleToggleSign()" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">+/-</button>
      <button onclick="handleDigit('0')" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">0</button>
      <button onclick="handleDoubleZero()" class="flex items-center justify-center rounded-[6px] transition-colors text-[1.1rem] font-medium bg-[#ffffff] hover:bg-[#f3f3f3] active:bg-[#e8e8e8] text-gray-900 shadow-sm border border-gray-100">,</button>
      <button onclick="handleEqual()" class="flex items-center justify-center rounded-[6px] transition-colors text-2xl font-medium bg-black hover:bg-gray-800 active:bg-gray-900 text-white shadow-md">=</button>
    </div>
  </div>

  <script>
    // --- Variáveis de Estado ---
    let inputDigits = "";
    let previousSeconds = null;
    let operator = null;
    let waitingForNewValue = false;
    let memory = 0;
    let expressionDisplay = "";

    // --- Elementos do DOM ---
    const mainDisplayEl = document.getElementById('mainDisplay');
    const expressionDisplayEl = document.getElementById('expressionDisplay');
    const btnMc = document.getElementById('btn-mc');
    const btnMr = document.getElementById('btn-mr');
    const btnMdown = document.getElementById('btn-mdown');

    // --- Funções Auxiliares de Lógica de Tempo ---
    function formatDigitsToTimeStr(digits) {
      if (!digits) return "00:00:00";
      let cleanDigits = digits.replace(/^0+/, '');
      if (cleanDigits === '') cleanDigits = '0';
      
      const padded = cleanDigits.padStart(6, '0');
      const s = padded.slice(-2);
      const m = padded.slice(-4, -2);
      const h = padded.slice(0, -4); 
      
      return `${h.padStart(2, '0')}:${m}:${s}`;
    }

    function timeStrToSeconds(timeStr) {
      const parts = timeStr.split(':');
      if (parts.length !== 3) return 0;
      const h = parseInt(parts[0], 10) || 0;
      const m = parseInt(parts[1], 10) || 0;
      const s = parseInt(parts[2], 10) || 0;
      return (h * 3600) + (m * 60) + s;
    }

    function secondsToDigits(totalSeconds) {
      const absSec = Math.abs(totalSeconds);
      const h = Math.floor(absSec / 3600);
      const m = Math.floor((absSec % 3600) / 60);
      const s = absSec % 60;
      
      const hStr = h.toString();
      const mStr = m.toString().padStart(2, '0');
      const sStr = s.toString().padStart(2, '0');
      
      return (hStr + mStr + sStr).replace(/^0+/, ''); 
    }

    function formatSecondsToDisplay(totalSeconds) {
      const isNegative = totalSeconds < 0;
      const digits = secondsToDigits(totalSeconds);
      const timeStr = formatDigitsToTimeStr(digits);
      return isNegative ? `-${timeStr}` : timeStr;
    }

    function getCurrentSeconds() {
      return timeStrToSeconds(formatDigitsToTimeStr(inputDigits));
    }

    // --- Atualização da UI ---
    function updateUI() {
      mainDisplayEl.innerText = formatDigitsToTimeStr(inputDigits);
      expressionDisplayEl.innerText = expressionDisplay;

      // Gerenciar botões de memória
      const memDisabledClass = "text-gray-400 cursor-not-allowed";
      const memEnabledClass = "text-gray-900";
      
      if (memory === 0) {
        btnMc.className = btnMc.className.replace(memEnabledClass, memDisabledClass);
        btnMr.className = btnMr.className.replace(memEnabledClass, memDisabledClass);
        btnMdown.className = btnMdown.className.replace(memEnabledClass, memDisabledClass);
      } else {
        btnMc.className = btnMc.className.replace(memDisabledClass, memEnabledClass);
        btnMr.className = btnMr.className.replace(memDisabledClass, memEnabledClass);
        btnMdown.className = btnMdown.className.replace(memDisabledClass, memEnabledClass);
      }
    }

    // --- Lógica de Ações ---
    function handleDigit(digit) {
      if (waitingForNewValue) {
        inputDigits = digit;
        waitingForNewValue = false;
      } else {
        if (inputDigits.length < 10) {
          inputDigits += digit;
        }
      }
      updateUI();
    }

    function handleDoubleZero() {
      handleDigit('0');
      handleDigit('0');
    }

    function calculateResult(aSecs, bSecs, op) {
      switch (op) {
        case '+': return aSecs + bSecs;
        case '-': return aSecs - bSecs;
        case '*':
        case 'x': return Math.floor(aSecs * bSecs); 
        case '/':
        case '÷': return bSecs === 0 ? 0 : Math.floor(aSecs / bSecs);
        case '%': return Math.floor(aSecs * (bSecs / 100));
        default: return bSecs;
      }
    }

    function handleOperator(nextOperator) {
      const currentSeconds = getCurrentSeconds();
      const opDisplay = nextOperator === '*' ? '×' : nextOperator === '/' ? '÷' : nextOperator;

      if (operator && !waitingForNewValue && previousSeconds !== null) {
        const resultSecs = calculateResult(previousSeconds, currentSeconds, operator);
        
        expressionDisplay = `${formatSecondsToDisplay(resultSecs)} ${opDisplay}`;
        inputDigits = secondsToDigits(resultSecs) || "0";
        previousSeconds = resultSecs;
      } else {
        expressionDisplay = `${formatSecondsToDisplay(currentSeconds)} ${opDisplay}`;
        previousSeconds = currentSeconds;
      }
      
      operator = nextOperator;
      waitingForNewValue = true;
      updateUI();
    }

    function handleEqual() {
      if (!operator || previousSeconds === null) return;

      const currentSeconds = getCurrentSeconds();
      const resultSecs = calculateResult(previousSeconds, currentSeconds, operator);
      const opDisplay = operator === '*' ? '×' : operator === '/' ? '÷' : operator;
      
      expressionDisplay = `${formatSecondsToDisplay(previousSeconds)} ${opDisplay} ${formatSecondsToDisplay(currentSeconds)} =`;
      inputDigits = secondsToDigits(resultSecs) || "0";
      previousSeconds = null;
      operator = null;
      waitingForNewValue = true;
      updateUI();
    }

    function handleBackspace() {
      if (waitingForNewValue) return;
      inputDigits = inputDigits.slice(0, -1);
      updateUI();
    }

    function handleClearEntry() {
      inputDigits = "";
      updateUI();
    }

    function handleClearAll() {
      inputDigits = "";
      previousSeconds = null;
      operator = null;
      expressionDisplay = "";
      waitingForNewValue = false;
      updateUI();
    }

    function handleToggleSign() {
      if(inputDigits !== "") {
         const currentSeconds = getCurrentSeconds();
         if(currentSeconds !== 0) {
            inputDigits = secondsToDigits(-currentSeconds) || "0";
            updateUI();
         }
      }
    }

    function handleMemory(action) {
      const currentSeconds = getCurrentSeconds();
      switch(action) {
        case 'MC': 
          memory = 0; 
          break;
        case 'MR': 
          if(memory !== 0) {
            inputDigits = secondsToDigits(memory); 
            waitingForNewValue = true;
          }
          break;
        case 'M+': 
          memory += currentSeconds; 
          break;
        case 'M-': 
          memory -= currentSeconds; 
          break;
        case 'MS': 
          memory = currentSeconds; 
          break;
      }
      updateUI();
    }

    // --- Integração com Teclado ---
    window.addEventListener('keydown', (e) => {
      const key = e.key;

      if (/[0-9]/.test(key)) {
        handleDigit(key);
      } else if (key === '+' || key === '-') {
        handleOperator(key);
      } else if (key === '*' || key === 'x' || key === 'X') {
        handleOperator('x');
      } else if (key === '/' || key === '÷') {
        e.preventDefault(); 
        handleOperator('÷');
      } else if (key === 'Enter' || key === '=') {
        e.preventDefault();
        handleEqual();
      } else if (key === 'Backspace') {
        handleBackspace();
      } else if (key === 'Escape') {
        handleClearAll();
      } else if (key === ',' || key === '.') {
         handleDoubleZero();
      }
    });

    // Setup inicial
    updateUI();
  </script>
</body>
</html>
